<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Orbit — Network Operations Center & Infrastructure Intelligence">
    <title>{% block title %}Orbit{% endblock %}</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="/static/css/style.css" rel="stylesheet">

    {% block head %}{% endblock %}
</head>

<body>
    <!-- ═══ Global Navigation ═══ -->
    <nav class="orbit-nav">
        <div class="orbit-nav-brand">
            <div class="noc-logo" style="background: linear-gradient(135deg, #6366f1, #06b6d4); font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px;">ORBIT</div>
        </div>
        <div class="orbit-nav-links">
            <a href="/" class="orbit-nav-item {% block nav_dashboard %}{% endblock %}" id="nav-dashboard">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/wifi" class="orbit-nav-item {% block nav_wifi %}{% endblock %}" id="nav-wifi">
                <i class="bi bi-wifi"></i> WiFi
            </a>
            <a href="/topology" class="orbit-nav-item {% block nav_topology %}{% endblock %}" id="nav-topology">
                <i class="bi bi-diagram-3"></i> Topología
            </a>
        </div>
    </nav>

    {% block body %}{% endblock %}

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
